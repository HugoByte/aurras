
[package]
name = 'event_feed'
authors = ['The HugoByte Team <hello@hugobyte.com>']
edition = '2021'
repository = 'https://github.com/hugobyte/aurras.git'
version = '0.0.1'

[dependencies]
subxt = '0.35.3'
dotenv = '0.15.0'
serde_json = "1.0.116"
serde ={ version = "1.0.198", features = ["derive"]}
dirs = "5.0.1"
envy = "0.4"
anyhow = "1.0.82"
icon-sdk = '1.2.0'

[dependencies.runtime]
path="../runtime/lite"

[dependencies.kuska-ssb]
git = 'https://github.com/shanithkk/ssb.git'
branch = 'fix-invite-accept-issue'

[dependencies.tokio]
version = '1.36.0'
features = ['macros', 'time', 'rt-multi-thread']

[dependencies.async-std]
version = '1.12.0'
features = [
    'unstable',
    'attributes',
]