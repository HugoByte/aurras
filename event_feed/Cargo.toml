[package]
name = 'event_feed'
authors = ['The HugoByte Team <hello@hugobyte.com>']
edition = '2021'
repository = 'https://github.com/hugobyte/aurras.git'
version = '0.0.1'

[dependencies]
subxt = '0.35.3'
dotenv = '0.15.0'
serde_json = '1.0.116'
dirs = '5.0.1'
envy = '0.4'
anyhow = '1.0.82'
icon-sdk = '1.2.0'
tendermint-rpc = {version = "0.35.0", features = ["http-client", "websocket-client"]}
futures = "0.3.30"
base64 = "0.22.0"

[dependencies.ethers]
version = '2.0.8'
default_features = false
features = [
    'ws',
    'rustls',
]

[dependencies.serde]
version = '1.0.198'
features = ['derive']

[dependencies.runtime]
path = '../runtime/lite'

[dependencies.tokio]
version = '1.36.0'
features = [
    'macros',
    'time',
    'rt-multi-thread',
]
